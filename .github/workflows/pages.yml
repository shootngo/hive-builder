name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode icons (.hex -> .png)
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          for f in sorted(Path('icons').glob('*.hex')):
              out = f.with_suffix('')
              out.write_bytes(bytes.fromhex(f.read_text().strip()))
              print('decoded', f.name, '->', out.name, out.stat().st_size, 'bytes')
          PY
      - name: Configure Pages (tries to enable Pages with build_type=workflow)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
